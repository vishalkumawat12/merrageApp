<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Discovery - Dating App</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee2b5b",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221015",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex min-h-screen flex-col mx-auto max-w-md bg-background-light dark:bg-background-dark shadow-2xl">
<!-- Header -->
<header class="flex items-center justify-between px-6 py-4 sticky top-0 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md z-10">
<div class="flex items-center gap-2">
<div class="size-8 bg-primary rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-white text-xl">favorite</span>
</div>
<h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Flame</h1>
</div>
<button class="p-2 hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined text-slate-700 dark:text-slate-300">tune</span>
</button>
</header>
<!-- Main Discovery Feed -->
<main class="flex-1 px-4 py-2 overflow-y-auto">
<!-- Profile Card -->
<div class="relative w-full aspect-[3/4] rounded-3xl overflow-hidden shadow-xl group">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Close up portrait of a smiling young woman with dark hair" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDWQMSOsd81YseDukcxOpO75NMd_CxcWZ2kQ6hIEs2_FkIAXZXpgktBWc6h_ut6tR_bVf3Iz-WtQJiklBVH46vKm3IKcgQymhe5KeLAtEKeeL3iF-Y2i7bPbY2dwckKmBcTPZU-PRpUT3B1jXMm0jOmvCMtSOvkOsOxm4HA0qy2lBnkHd3Wl2zLii_08kMgtZhvlpmdfELx89MvrQ4BAQPBO7B467oseIp5GsvuDctio97Yu9Xw1HRn77dD4JfMcEOobSmoBjalDCI2')"></div>
<!-- Overlay Gradient -->
<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
<!-- Info Content -->
<div class="absolute bottom-0 left-0 right-0 p-6">
<div class="flex items-center gap-2 mb-2">
<h2 class="text-white text-3xl font-bold">Sarah, 24</h2>
<span class="material-symbols-outlined text-blue-400 text-xl fill-current" data-icon="verified">verified</span>
</div>
<div class="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
<span class="px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-white text-xs font-medium border border-white/30 whitespace-nowrap">Coffee Lover</span>
<span class="px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-white text-xs font-medium border border-white/30 whitespace-nowrap">Traveler</span>
<span class="px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-white text-xs font-medium border border-white/30 whitespace-nowrap">Designer</span>
</div>
<p class="text-slate-200 text-sm leading-relaxed mb-4 line-clamp-2">
                        Adventure seeker and coffee lover. Let's find the best sunset spot in the city. Looking for someone to share stories with.
                    </p>
<div class="flex items-center gap-1 text-slate-300 text-xs">
<span class="material-symbols-outlined text-sm">location_on</span>
<span>2 miles away</span>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex items-center justify-center gap-6 py-8">
<button class="size-16 rounded-full bg-white dark:bg-slate-800 shadow-lg flex items-center justify-center border border-slate-100 dark:border-slate-700 hover:scale-110 active:scale-95 transition-all">
<span class="material-symbols-outlined text-slate-500 text-3xl">close</span>
</button>
<button class="size-20 rounded-full bg-primary shadow-lg shadow-primary/30 flex items-center justify-center hover:scale-110 active:scale-95 transition-all">
<span class="material-symbols-outlined text-white text-4xl fill-current">favorite</span>
</button>
<button class="size-16 rounded-full bg-white dark:bg-slate-800 shadow-lg flex items-center justify-center border border-slate-100 dark:border-slate-700 hover:scale-110 active:scale-95 transition-all">
<span class="material-symbols-outlined text-yellow-500 text-3xl fill-current">star</span>
</button>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="sticky bottom-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 pb-6 pt-2">
<div class="flex items-center justify-around px-2">
<a class="flex flex-col items-center gap-1 p-2 text-primary" href="#">
<span class="material-symbols-outlined text-2xl fill-current">explore</span>
<span class="text-[10px] font-bold">Discover</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">favorite_border</span>
<span class="text-[10px] font-bold">Likes</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-primary transition-colors" href="#">
<div class="relative">
<span class="material-symbols-outlined text-2xl">chat_bubble</span>
<div class="absolute -top-1 -right-1 size-3 bg-primary rounded-full border-2 border-white dark:border-slate-900"></div>
</div>
<span class="text-[10px] font-bold">Messages</span>
</a>
<a class="flex flex-col items-center gap-1 p-2 text-slate-400 hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-2xl">person</span>
<span class="text-[10px] font-bold">Profile</span>
</a>
</div>
</nav>
</div>
<!-- Background Decoration for larger screens -->
<div class="hidden lg:block fixed inset-0 -z-10 bg-gradient-to-br from-primary/5 via-background-light to-primary/10 dark:from-background-dark dark:to-background-dark"></div>
</body></html>
